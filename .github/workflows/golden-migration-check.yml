name: Golden migration checks v3
on:
  push:
    branches: [migration/json-games]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check index.js
      - run: node --check golden-catalog.js
      - run: node --check golden-social.js
      - run: node --check golden-utilities.js
      - run: node --check golden-json-db.js
      - run: node --check golden-models.js
      - run: node --test test/golden-json-db.test.js
      - run: node --test test/golden-social.test.js
      - run: node --test test/golden-utilities.test.js
